database:
  enabled: false # If false, data is stored as files
  host: "localhost"
  port: 3306
  database: "merger"
  username: "root"
  password: ""

debug_mode: false

settings:
  # Do you want there to be a notification given in console and to admins when there is an update available
  # Default: true
  update_notification: true

  # Choose which language file you want to use
  # Options: lang_en, lang_es, lang_de, lang_fr, lang_nl
  # Default: lang_en
  language: lang_en

  energy_regen: 1 # in seconds
  starter_producer: starter_producer
  producer_overheat_cooldown: 60
  max_coins: 1000
  coins_hook_name: essentialsX
  max_upgrades_per_page: 10
  max_orders_per_page: 5
  max_orders_per_player: 10

item_paths:
  '1':
    - "rose"
    - "tulip"
    - "allium"
    - "lilac"
    - "torchflower"
  '2':
    - "seeds"
    - "pumpkin_seeds"
    - "pumpkin"
    - "carvedpumpkin"
  '3':
    - "red_dye"
    - "red_wool"

gui:
  # When using the /merge command (The GUI)
  backpack_page:
    # What do you want the title of the GUI to be
    # Default: " "
    title: "#1baecf&lBackpack"

    # Default: 54
    size: 54

    icons:
      # Here you can create/edit the different icons in the GUI
      sell_icon:
        type: block
        value: EMERALD
        display_name: "&9eSell Merge Items"
        slot: 4
        click_action: open;sell
        lore:
          - ""
      backpack_icon:
        type: block
        value: CHEST
        display_name: "&9New Items"
        slot: 4
        click_action: open;backpack_page
        lore:
          - ""
      info_icon:
        type: block
        value: BOOK
        display_name: "&2How to play"
        slot: 4
        lore:
          - ""
      close_icon:
        type: block
        value: BARRIER
        display_name: "&cClose"
        slot: 5
        click_action: close # Valid types: close, open:<GUI name>, next_page, previous_page
        lore:
          - ""
          - "&7Click me to close the menu"
  game_page:
    # What do you want the title of the GUI to be
    # Default: " "
    title: "#1baecf&lMerging Game"

    icons:
      # Here you can create/edit the different icons in the GUI
      sell_icon:
        type: block
        value: EMERALD
        display_name: "&9Sell Merge Items"
        slot: 2
        click_action: open;sell
        lore:
          - ""
      stats_icon:
        type: block
        value: PLAYER_HEAD
        display_name: "&aYour stats"
        slot: 1
        lore:
          - "%energy%"
          - "%coins%"
      backpack_icon:
        type: block
        value: CHEST
        display_name: "&9New Items"
        slot: 3
        click_action: open;backpack_page
        lore:
          - ""
      info_icon:
        type: block
        value: BOOK
        display_name: "&2How to play"
        slot: 4
        lore:
          - ""
      close_icon:
        type: block
        value: BARRIER
        display_name: "&cClose"
        slot: 5
        click_action: close # Valid types: close, open:<GUI name>, next_page, previous_page
        lore:
          - ""
          - "&7Click me to close the menu"
      upgrades_icon:
        type: block
        value: NETHER_STAR
        display_name: "&6View upgrades"
        slot: 6
        click_action: open;upgrade_page # Valid types: close, open:<GUI name>, next_page, previous_page
        lore:
          - ""
          - "&7Click me to view the upgrades the menu"
      orders_icon:
        type: block
        value: gold_ingot
        display_name: "&eView Orders"
        slot: 7
        click_action: open;order_page
        lore:
          - ""
          - "&7Click me to view the orders the menu"

  # Explanation
  orders_page:
    # What do you want the title of the GUI to be
    # Default: " "
    title: "#1baecf&lOrders Page"

    # Default: 54
    size: 54

    # Here you can edit the different icons
    icons:
      filler_icon:
        type: block
        value: LIME_STAINED_GLASS_PANE
        slot: [ 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 51, 52, 53 ]
        display_name: "&8"
      info_icon:
        type: block
        value: BOOK
        display_name: "&2How to play"
        slot: 4
        lore:
          - ""
      close_icon:
        type: block
        value: BARRIER
        display_name: "&cClose"
        slot: 5
        click_action: close
        lore:
          - ""
          - "&7Click me to close the menu"
      back_icon:
        type: block
        value: BARRIER
        display_name: "&cBack"
        slot: 6
        click_action: open;game_page
        lore:
          - ""
          - "&7Click me to the game page"
      next_page_icon:
        type: block # Valid types: block, texture
        value: SPECTRAL_ARROW
        display_name: "&eNext Page (%next_page_number%)"
        click_action: next_page
        slot: 50
      prev_page_icon:
        type: block
        value: SPECTRAL_ARROW
        display_name: "&ePrevious Page (%prev_page_number%)"
        click_action: previous_page
        slot: 48
        lore:
          - ""
          - "&fclick me"

  # Explanation
  upgrades_page:
    # What do you want the title of the GUI to be
    # Default: " "
    title: "#1baecf&lUpgrades"

    # Default: 54
    size: 54

    # Here you can edit the different icons
    #    producer_icon:
    #      type: block
    #      value: "%producer_item%"
    #      display_name: "%producer_name%"
    #      slot: [ 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 51, 52, 53 ]
    #      lore:
    #        - ""
    #        - "%producer_status%" # "Locked" or "Click to unlock"
    #        - ""
    icons:
      filler_icon:
        type: block
        value: LIME_STAINED_GLASS_PANE
        slot: [ 0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 46, 47, 51, 52, 53 ]
        display_name: "&8"
      info_icon:
        type: block
        value: BOOK
        display_name: "&2How to play"
        slot: 4
        lore:
          - ""
      close:
        type: block
        value: BARRIER
        display_name: "&cClose"
        slot: 5
        click_action: close
        lore:
          - ""
          - "&7Click me to close the menu"
      back:
        type: block
        value: BARRIER
        display_name: "&cBack"
        slot: 6
        click_action: open;game_page
        lore:
          - ""
          - "&7Click me to the game page"
      next_page:
        type: block # Valid types: block, texture
        value: SPECTRAL_ARROW
        display_name: "&eNext Page (%next_page_number%)"
        click_action: next_page
        slot: 50
      prev_page:
        type: block
        value: SPECTRAL_ARROW
        display_name: "&ePrevious Page (%prev_page_number%)"
        slot: 48
        click_action: previous_page
        lore:
          - ""
          - "&fclick me"


